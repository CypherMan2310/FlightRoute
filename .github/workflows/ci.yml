name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: "Backend tests (offline, fixtures only: the network is blocked in conftest)"
        run: cd backend && pytest
      - name: Training smoke run on SYNTHETIC data (writes to a temp dir, never to backend/models)
        run: cd backend && python -m aerogrid.train.train_all --source synthetic --days 20 --airports 8 --quick --out "$RUNNER_TEMP/smoke-models"
      - name: The smoke bundle loads and the API answers without any upstream
        run: |
          cd backend
          AEROGRID_MODELS="$RUNNER_TEMP/smoke-models" SCORECARD_DB="$RUNNER_TEMP/smoke.db" python - <<'PY'
          from fastapi.testclient import TestClient
          from aerogrid.api.main import create_app
          app = create_app(start_background=False)
          c = TestClient(app)
          h = c.get("/api/health").json()
          assert h["models"]["status"] == "trained" and h["models"]["trained_on"] == "synthetic", h
          print("health ok:", h["models"])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the single image (API + built frontend); not pushed
        run: docker build -t aerogrid:ci .
      - name: Run it and wait for the health check
        run: |
          docker run -d --name aerogrid -p 7860:7860 aerogrid:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs aerogrid
          exit 1
